# Auto Scaling Group
name: GitOps DOCKER-ASG CICD Pipeline
on:
  push:
    branches:
    - main
jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4
    
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{secrets.DOCKER_USER}}
    #     password: ${{secrets.DOCKER_PASSWORD}}
        
    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    # ECR에 Docker 이미지 빌드 및 푸시
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Docker image Build & Push to ECR
      # env:
      #   ECR_REGISTRY: ${{}}
      #   ECR_REPOSITORY: ${{}}
      #   IMAGE_TAG: ${{github.sha}}
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.ap-southeast-2.amazonaws.com/nginx:1.31.3-ecr ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.ap-southeast-2.amazonaws.com/nginx:latest ./nginx
        docker push 925047940866.dkr.ecr.ap-southeast-2.amazonaws.com/nginx:1.31.3-ecr
        docker push 925047940866.dkr.ecr.ap-southeast-2.amazonaws.com/nginx:latest

    - name: 컨테이너 배포 및 S3 파일 싱크
      run: |
        aws ssm send-command \
          --instance-ids "i-098c52d8121bddab5" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            \"aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.ap-southeast-2.amazonaws.com/nginx:latest\",
            \"sudo docker pull yjunho/nginx:1.31.3-cd\",
            \"sudo docker stop nginx-container || true\",
            \"sudo docker rm nginx-container || true\",
            \"sudo docker run -d --name nginx-container -p 80:80 925047940866.dkr.ecr.ap-southeast-2.amazonaws.com/nginx:latest\"
          ]" \
          --region ${{secrets.AWS_REGION}} \
          --comment "Deploying SSM docker"